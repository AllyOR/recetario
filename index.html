<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recetario</title>
  <meta name="description" content="Recetas bolivianas y del mundo, simples y nutritivas. Dime qué tienes en casa y te digo qué puedes cocinar.">
  <meta name="theme-color" content="#a63d14">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍲%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/estilos.css">
  <script>
    // Pone el modo día o noche antes de pintar, para que no parpadee.
    (function () {
      var tema = null;
      try { tema = localStorage.getItem("recetario.tema"); } catch (e) {}
      if (tema !== "claro" && tema !== "oscuro") {
        tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro";
      }
      document.documentElement.dataset.tema = tema;
    })();
  </script>
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="cabecera">
    <a class="marca" href="#/"><span aria-hidden="true">🍲</span> Recetario</a>
    <nav class="menu" aria-label="Secciones">
      <a href="#/" data-seccion="inicio"><span class="menu-icono" aria-hidden="true">🧺</span><span>Qué tengo</span></a>
      <a href="#/menu" data-seccion="menu"><span class="menu-icono" aria-hidden="true">📅</span><span>Menú</span></a>
      <a href="#/comidas" data-seccion="comidas"><span class="menu-icono" aria-hidden="true">🍽️</span><span>Comidas</span></a>
      <a href="#/bebidas" data-seccion="bebidas"><span class="menu-icono" aria-hidden="true">🥤</span><span>Bebidas</span></a>
      <a href="#/postres" data-seccion="postres"><span class="menu-icono" aria-hidden="true">🍮</span><span>Postres</span></a>
      <a href="#/sugerencias" data-seccion="sugerencias"><span class="menu-icono" aria-hidden="true">💡</span><span>Ideas</span></a>
    </nav>
    <button type="button" id="tema" class="boton-tema" hidden></button>
  </header>

  <main id="contenido" tabindex="-1">
    <noscript>
      <p class="aviso">Este recetario necesita JavaScript para funcionar. Actívalo en tu navegador y vuelve a cargar la página.</p>
    </noscript>
  </main>

  <footer class="pie">
    <p>Recetario · Recetas caseras de Bolivia y del mundo</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
